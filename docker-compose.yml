version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bookloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookloop_db
      POSTGRES_USER: bookloop_user
      POSTGRES_PASSWORD: bookloop_secure_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookloop_user -d bookloop_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bookloop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: bookloop-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://bookloop_user:bookloop_secure_password_dev@postgres:5432/bookloop_db
      ENVIRONMENT: development
      DEBUG: "True"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: bookloop-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
