<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2C5E43" />
    <title>BookLoop — Peer-to-Peer Used-Book Marketplace (India)</title>
    <meta name="description" content="Buy and sell pre-loved used books directly between readers in India. Doorstep courier pickup and delivery starting in Bidar, Karnataka. Verified physical copies with photo condition disclosures." />
    <link rel="canonical" href="https://bookloop.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bookloop.in/" />
    <meta property="og:title" content="BookLoop — Peer-to-Peer Used-Book Marketplace" />
    <meta property="og:description" content="Buy and sell pre-loved used books in India. Verified copies, real photos, affordable prices, and door-to-door courier delivery starting in Bidar." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BookLoop — Peer-to-Peer Used-Book Marketplace" />
    <meta name="twitter:description" content="Buy and sell pre-loved used books in India. Doorstep courier pickup and delivery." />

    <!-- Google Fonts: Outfit for UI, Lora for editorial book typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BookLoop",
      "url": "https://bookloop.in/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://bookloop.in/explore?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
